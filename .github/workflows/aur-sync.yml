name: Sync to AUR

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync-aur:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Update AUR package
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          # Calculate new version from git commit history
          REV_COUNT=$(git rev-list --count HEAD)
          SHORT_REV=$(git rev-parse --short=7 HEAD)
          NEW_VER="r${REV_COUNT}.${SHORT_REV}"
          echo "Updating AUR to version: ${NEW_VER}"

          # Clone the AUR repository
          git clone ssh://aur@aur.archlinux.org/kotsasmin-toolkit-git.git aur_pkg
          cp PKGBUILD aur_pkg/

          # Update pkgver in PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" aur_pkg/PKGBUILD

          # Generate .SRCINFO using Arch Linux container
          docker run --rm -v "$(pwd)/aur_pkg:/pkg" -w /pkg archlinux:base-devel bash -c "
            pacman -Syu --noconfirm git &&
            useradd -m builder &&
            chown -R builder /pkg &&
            su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          "

          # Commit and push changes to AUR
          cd aur_pkg
          git config user.name "Kotsasmin"
          git config user.email "kotsasmin@gmail.com"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "AUR is already up to date with version ${NEW_VER}."
          else
            git commit -m "Auto-update version to ${NEW_VER}"
            git push origin master
            echo "Successfully pushed update ${NEW_VER} to AUR!"
          fi
